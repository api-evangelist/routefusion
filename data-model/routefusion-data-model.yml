entities:
- name: Organization
  description: Top-level account tenant; owns users and entities.
- name: User
  description: A person/account within an organization; may have the admin role.
- name: Entity
  description: A business or personal entity that transacts; goes through compliance
    onboarding (finalizeEntity) and has representatives.
- name: Representative
  description: A representative of a business entity.
- name: Wallet
  description: A multi-currency balance held by an entity; can be funded and used to
    send transfers.
- name: VirtualAccount
  description: A sub-account under a main currency account, tied to a single entity,
    used for reconciliation.
- name: Beneficiary
  description: A business or personal payee that can receive transfers.
- name: Transfer
  description: An outgoing cross-border payment moving through a state machine.
- name: IncomingTransfer
  description: An inbound credit to a wallet/virtual account.
- name: Quote
  description: An FX rate locked for a limited time via getTransferQuote.
- name: WebhookSubscription
  description: A configured event subscription (transfer/entity/incoming_transfer/wallet/beneficiary/rfi).
