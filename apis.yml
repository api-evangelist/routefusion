aid: routefusion
name: Routefusion
description: 'Routefusion is a global payments infrastructure platform that lets platforms,
  fintechs, and marketplaces move money across borders through a single GraphQL API.
  It supports payouts to 180+ countries over SWIFT, local rails, and stablecoin (USDC),
  non-resident and FDIC/virtual accounts in multiple currencies, multi-currency wallets,
  FX rate locking and quotes, beneficiary and entity onboarding with compliance review,
  incoming-transfer reconciliation, and Ed25519-signed webhooks. The API is GraphQL
  over HTTPS with bearer-token authentication and a full sandbox environment. This
  profile was added to the API Evangelist network as a portfolio company of Initialized
  Capital and enriched from Routefusion''s public developer documentation.'
