                      - enum: medical
                        description: Medical related payment
                      - enum: travel
                        description: Travel Related Payment
                      - enum: education
                        description: Education related payment
                      - enum: advertising
                        description: Advertising, marketing, and public relations-related expenses
                      - enum: advisor_fees
                        description: Fees for advisory, technical, academic or specialist assistance
                      - enum: real_estate
                        description: Property or land purchase
                      - enum: royalties
                        description: Royalty, trademark, patent and copyright fees
                      - enum: taxes
                        description: Tax payment
                      - enum: utilities
                        description: Utility bills
                      - enum: commissions_or_fees
                        description: Commissions or Fees
                      - enum: commission_on_goods
                        description: Commission on goods
                      - enum: commission_on_services
                        description: Commission on services
                      - enum: accounting_services
                        description: Accounting services payment
                      - enum: exhibition_services
                        description: Exhibition services payment
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      resourcePurposesOfPayment:
                        type: array
                        items:
                          properties:
                            enum:
                              type: string
                              description: enum value of the purpose of payment
                            description:
                              type: string
                              description: Definition of enum value
                          type: object
