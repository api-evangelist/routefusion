  \"authorized_representative\",\n                        \"director\"\n                    ]\n                },\n                {\n                    \"variable\": \"tax_number\",\n                    \"regex\": null,\n                    \"example\": null,\n                    \"enum\": null\n                },\n                {\n                    \"variable\": \"date_of_birth\",\n                    \"regex\": \"/d{4}-[01]d-[0-3]dT[0-2]d:[0-5]d:[0-5]d(?:.d+)?Z?/\",\n                    \"example\": \"2018-01-04\",\n                    \"enum\": null\n                }\n            ],\n            \"documents\": [\n                [\n                    {\n                        \"enum\": \"passport\",\n                        \"type\": \"identity_verification\"\n                    }\n                ]\n            ]\n        }\n    }\n}"
