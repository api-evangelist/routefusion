        - language: node
          code: "// query incomingTransfersPage\n\nvar axios = require('axios');\nvar data = JSON.stringify({\n  query: `query incomingTransfersPage(\n$pagination: PaginationInput!\n$search_terms: String\n$filters: [FilterInput]\n) {\n    incomingTransfersPage(\n    pagination: $pagination\n    search_terms: $search_terms\n    filters: $filters\n    ) {\n    items {\n        wallet_id\n        currency\n        credit\n        debit\n        amount\n        transaction_date\n        remittance_info\n        counterparty_name\n        name_on_bank_account\n        nicename_on_bank_account\n        account_number\n        reference\n        virtual_account_name\n        organization_id\n        created_date\n        entity_id\n        incoming_transfer_account_id\n        incoming_transfer_account_name_on_bank_account\n        incoming_transfer_account_bank_name\n        purpose_of_payment\n        uuid\n        updated_date\n        state\n    }\n    pagination {\n        page\n        page_size\n        pages_total\n        items_total\n    }\n    updated_date\n    }\n}`,\n  variables: {\n    \"pagination\": {\n      \"page\":1,\n      \"page_size\":20\n    },\n    \"filters\": [{\n        \"key\": \"incoming_transfer_id\",\n        \"values\": [\n            \"922a11ff-55fb-4b9c-8f0c-be6a07337e99\",\n            \"e159ad7d-034c-4f88-8999-8ebb03978b65\"\n        ]\n    }]}\n});\n\nvar config = {\n  method: 'post',\n  url: 'https://sandbox.external.routefusion.com/graphql',\n  headers: {\n    'Authorization': 'Bearer <your token>',\n    'Content-Type': 'application/json'\n  },\n  data : data\n};\n\naxios(config)\n.then(function (response) {\n  console.log(JSON.stringify(response.data));\n})\n.catch(function (error) {\n  console.log(error);\n});"
