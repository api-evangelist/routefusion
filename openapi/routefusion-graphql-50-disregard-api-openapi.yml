      summary: deleteRepresentative
      description: Removes a representative from an entity. This may only be done before finalizing the entity.
      operationId: delete-representative
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  default: '{}'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Success:
                  value: "{\n  \"data\": {\n    \"deleteRepresentative\": true\n  }\n}"
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      deleteRepresentative:
                        type: boolean
                        example: true
                        default: true
      deprecated: false
      x-readme:
        code-samples:
        - language: node
          code: "const token = process.env.RF_KEY;\nconst axios = require('axios');\nlet data = JSON.stringify({\n  query: `mutation deleteRepresentative (\n    $id: UUID\n) {\n    deleteRepresentative (\n        id: $id\n    )\n}`,\n  variables: {\"id\":\"c1ad6c4f-ae6b-4f93-bede-3cee4aa1e5fb\"}\n});\n\nlet config = {\n  method: 'post',\n  maxBodyLength: Infinity,\n  url: 'https://sandbox.external.routefusion.com/graphql',\n  headers: { \n    'Content-Type': 'application/json', \n    'Authorization': 'Bearer {{token}}'\n  },\n  data : data\n};\n\naxios.request(config)\n.then((response) => {\n  console.log(JSON.stringify(response.data));\n})\n.catch((error) => {\n  console.log(error);\n});\n\n"
