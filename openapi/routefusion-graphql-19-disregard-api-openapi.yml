        code-samples:
        - language: node
          code: "// query beneficiariesPage\n\nvar axios = require('axios');\nvar data = JSON.stringify({\n  query: `query beneficiariesPage ($search_terms: String, pagination: PaginationInput!, filters: [FilterInput]) {\n    beneficiariesPage (search_terms: $search_terms, pagination: $pagination, filters: $filters) {\n      items {\n        id\n        entity {\n          id\n        }\n        creator {\n          id\n        }\n        type\n        email\n        phone\n        phone_country\n        tax_number\n        first_name\n        last_name\n        address1\n        address2\n        city\n        state_province_region\n        postal_code\n        country\n        contact_first_name\n        contact_last_name\n        business_name\n        name_on_bank_account\n        swift_bic\n        account_number\n        routing_code\n        currency\n        bank_name\n        branch_name\n        bank_address1\n        bank_address2\n        bank_city\n        bank_state_province_region\n        bank_postal_code\n        bank_country\n      }\n    }\n}`,\n  variables: { \"pagination\": { \"page\": 1, \"page_size\": 20 }, \"filters\": [{ \"key\": \"country\", \"values\" [\"US\"] }] }\n});\n\nvar config = {\n  method: 'post',\n  url: 'https://sandbox.external.routefusion.com/graphql',\n  headers: {\n    'Authorization': 'Bearer <your token>',\n    'Content-Type': 'application/json'\n  },\n  data : data\n};\n\naxios(config)\n.then(function (response) {\n  console.log(JSON.stringify(response.data));\n})\n.catch(function (error) {\n  console.log(error);\n});"
