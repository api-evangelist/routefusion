paths:
  /graphql (32 disregard):
    post:
      summary: getRate
      description: The getRate query fetches the current rate for a currency pair. This does not lock a rate for a transfer. You can lock a rate with the getTransferQuote mutation.
      operationId: get-rate
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  default: '{}'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"data\": {\n        \"getRate\": {\n            \"rate\": \"20.524800\",\n            \"inverted_rate\": \"0.048722\",\n            \"source_currency\": \"USD\",\n            \"destination_currency\": \"MXN\"\n        }\n    }\n}"
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      getRate:
                        type: object
                        properties:
                          rate:
                            type: string
                            example: '20.524800'
                          inverted_rate:
                            type: string
                            example: '0.048722'
                          source_currency:
                            type: string
                            example: USD
                          destination_currency:
                            type: string
                            example: MXN
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      x-readme:
        code-samples:
        - language: node
          code: "// query getRate\n\nvar axios = require('axios');\nvar data = JSON.stringify({\n  query: `query getRate (\n    $source_currency: ISO4217!\n    $destination_currency: ISO4217!\n) {\n    getRate (\n        source_currency: $source_currency\n        destination_currency: $destination_currency\n    ) {\n        rate\n        inverted_rate\n        source_currency\n        destination_currency\n    }\n}`,\n  variables: {\"source_currency\":\"USD\",\"destination_currency\":\"MXN\"}\n});\n\nvar config = {\n  method: 'post',\n  url: 'https://external.routefusion.com/graphql',\n  headers: {\n    'Authorization': 'Bearer <your token>',\n    'Content-Type': 'application/json'\n  },\n  data : data\n};\n\naxios(config)\n.then(function (response) {\n  console.log(JSON.stringify(response.data));\n})\n.catch(function (error) {\n  console.log(error);\n});\n"
        - language: curl
          code: '# query getRate


            curl --location --request POST ''https://external.routefusion.com/graphql'' \

            --header ''Authorization: Bearer <your token>'' \

            --header ''Content-Type: application/json'' \

            --data-raw ''{"query":"query getRate (\n    $source_currency: ISO4217!\n    $destination_currency: ISO4217!\n) {\n    getRate (\n        source_currency: $source_currency\n        destination_currency: $destination_currency\n    ) {\n        rate\n        inverted_rate\n        source_currency\n        destination_currency\n    }\n}","variables":{"source_currency":"USD","destination_currency":"MXN"}}'''
        samples-languages:
        - node
        - curl
      tags:
      - Graphql (32 Disregard)
