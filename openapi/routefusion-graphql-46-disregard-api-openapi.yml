        code-samples:
        - language: node
          code: "// query walletFundingInstructions\n\nvar axios = require('axios');\nvar data = JSON.stringify({\n  query: `query ($wallet_id: UUID!) {\n    walletFundingInstructions (wallet_id: $wallet_id) {\n      type\n      currency\n      bank_name\n      bank_address1\n      bank_city\n      bank_state_province_region\n      bank_postal_code\n      bank_country\n      account_number\n      routing_code\n      swift_bic\n    }\n}`,\n  variables: {\"wallet_id\":\"43033d1c-7bf0-4462-a6fe-a74aa1869725\"}\n});\n\nvar config = {\n  method: 'post',\n  url: 'https://sandbox.external.routefusion.com/graphql',\n  headers: {\n    'Authorization': 'Bearer <your token>',\n    'Content-Type': 'application/json'\n  },\n  data : data\n};\n\naxios(config)\n.then(function (response) {\n  console.log(JSON.stringify(response.data));\n})\n.catch(function (error) {\n  console.log(error);\n});"
