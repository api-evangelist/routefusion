        code-samples:
        - language: node
          code: "const axios = require('axios');\nconst token = process.env.RF_KEY;\n\nlet data = JSON.stringify({\n  query: `mutation createRepresentative (\n    $entity_id: UUID\n    $representative: RepresentativeInput\n) {\n    createRepresentative (\n        entity_id: $entity_id\n        representative: $representative\n    )\n}`,\n  variables: {\n    entity_id: \"YOUR_ENTITY_ID\",\n    representative: {\n      document_expiration_date: '1990-09-26T00:00:00Z',\n      document_issue_date: '2020-10-28T00:00:00Z',\n      document_number: '9078092879078320978',\n      citizenship: \"USA\",\n      date_of_birth: \"1990-09-26T00:00:00Z\",\n      email: 'meow@meow.com',\n      first_name: \"John\",\n      is_signer: true,\n      last_name: \"Smith\",\n      job_title: \"CEO\",\n      ownership_percentage: 100,\n      passport_number: null,\n      phone: '2813308004',\n      residential_address: '1305 e 6th street',\n      residential_address2: null,\n      residential_city: \"Austin\",\n      residential_country: \"USA\",\n      residential_postal_code: '78733',\n      residential_state_province_region: \"TX\",\n      responsibility: \"ultimate_beneficial_owner\",\n      tax_number: '12123222'\n    }\n  }\n});\n\nlet config = {\n  method: 'post',\n  maxBodyLength: Infinity,\n  url: 'https://sandbox.external.routefusion.com/graphql',\n  headers: {\n    'Content-Type': 'application/json',\n    'Authorization': `Bearer ${token}`\n  },\n  data: data\n};\n\naxios.request(config)\n  .then((response) => {\n    console.log(JSON.stringify(response.data, null, 2));\n  })\n  .catch((error) => {\n    console.error(error.response ? error.response.data : error.message);\n  });"
        - language: curl
          code: "curl -X POST https://sandbox.external.routefusion.com/graphql \\\n-H \"Content-Type: application/json\" \\\n-H \"Authorization: Bearer YOUR_API_TOKEN\" \\\n-d '{\n  \"query\": \"mutation createRepresentative ($entity_id: UUID, $representative: RepresentativeInput) { createRepresentative (entity_id: $entity_id, representative: $representative) }\",\n  \"variables\": {\n    \"entity_id\": \"0c5f6e46-a0eb-4d8d-9498-df5a541c0548\",\n    \"representative\": {\n      \"document_expiration_date\": \"1990-09-26T00:00:00Z\",\n      \"document_issue_date\": \"2020-10-28T00:00:00Z\",\n      \"document_number\": \"9078092879078320978\",\n      \"citizenship\": \"USA\",\n      \"date_of_birth\": \"1990-09-26T00:00:00Z\",\n      \"email\": \"meow@meow.com\",\n      \"first_name\": \"John\",\n      \"is_signer\": true,\n      \"last_name\": \"Smith\",\n      \"job_title\": \"CEO\",\n      \"ownership_percentage\": 100,\n      \"passport_number\": null,\n      \"phone\": \"2813308004\",\n      \"residential_address\": \"1305 e 6th street\",\n      \"residential_address2\": null,\n      \"residential_city\": \"Austin\",\n      \"residential_country\": \"USA\",\n      \"residential_postal_code\": \"78733\",\n      \"residential_state_province_region\": \"TX\",\n      \"responsibility\": \"UBO\",\n      \"tax_number\": \"12123222\"\n    }\n  }\n}'\n"
        samples-languages:
        - node
        - curl
